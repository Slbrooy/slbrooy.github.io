<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - Rhizome Springs</title>
  <meta name="description" content="Workshops, dance festivals, ecological learning, and community gatherings at Rhizome Springs on Salt Spring Island.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=1774345250">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="container header-grid">
      <nav class="nav-left">
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
      </nav>
      <a href="index.html" class="logo">
        <img src="images/logo-white.png" alt="Rhizome Springs">
      </a>
      <nav class="nav-right">
        <a href="shop.html" class="cart-link" aria-label="Cart">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge"></span>
        </a>
        <a href="mailto:info@rhizomesprings.com" class="btn-nav">Get Involved</a>
      </nav>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero hero-short" style="background-image: url('images/events-hero.jpg');">
    <div class="hero-content">
      <h1>Events</h1>
    </div>
  </section>

  <!-- EVENTS LISTING -->
  <section>
    <div class="container">
      <h2 class="section-title reveal">Upcoming Events</h2>
      <div id="events-list">
        <!-- Rendered by site.js from content/events.json -->
      </div>
    </div>
  </section>

  <!-- PARTNERSHIP CTA -->
  <section class="section-accent">
    <div class="container text-center">
      <div class="reveal narrow-text">
        <p class="lead-text">Interested in partnering on an event?</p>
        <div style="margin-top:20px;">
          <a href="mailto:info@rhizomesprings.com" class="btn">Contact Us</a>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="container">
      <div class="footer-grid">
        <div class="footer-logo">
          <img src="images/logo-white.png" alt="Rhizome Springs" class="footer-logo-vertical">
          <img src="images/logo-horizontal-white.png" alt="Rhizome Springs" class="footer-logo-horizontal">
        </div>
        <div class="footer-info text-center">
          <p>The Land of Living Inquiry</p>
          <p>Salt Spring Island, British Columbia</p>
          <p><em>An exploratorium for ecology, creativity and embodiment</em></p>
        </div>
        <div class="footer-links">
          <a href="about.html">About</a>
          <span class="dot">&middot;</span>
          <a href="events.html">Events</a>
          <span class="dot">&middot;</span>
        </div>
      </div>
      <div class="footer-newsletter">
        <form class="newsletter-form">
          <input type="email" placeholder="Email Address" required>
          <button type="submit">Sign Up</button>
        </form>
        <p class="newsletter-msg"></p>
      </div>
    </div>
  </footer>

  <script>
    document.querySelector('.nav-toggle').addEventListener('click', function() {
      document.querySelectorAll('.nav-left, .nav-right').forEach(function(n) { n.classList.toggle('active'); });
      document.querySelector('header').classList.toggle('nav-open');
    });
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
    document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(function(el) {
      observer.observe(el);
    });
  </script>
  <script src="js/site.js?v=1774345250"></script>
</body>
</html>
